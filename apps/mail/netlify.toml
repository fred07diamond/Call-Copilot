[build]
  ignore = "node ./scripts/netlify-ignore-build.mjs mail"
  command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && DATABASE_URL=\"${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL}\" APP_BASE_PATH=/mail VITE_APP_BASE_PATH=/mail NITRO_PRESET=netlify pnpm --filter mail build"
  publish = "apps/mail/dist"
  functions = "apps/mail/.netlify/functions-internal"

[build.environment]
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

# A2A delegation calls run a full agent loop (LLM + tool calls + DB queries).
# The framework does not impose a default agent-run timeout; if a template sets
# AGENT_RUN_SOFT_TIMEOUT_MS, keep it below this function timeout so the hidden
# auto-continuation path can hand off before Netlify kills the function.
  APP_BASE_PATH = "/mail"
  VITE_APP_BASE_PATH = "/mail"
[functions."*"]
  timeout = 75
