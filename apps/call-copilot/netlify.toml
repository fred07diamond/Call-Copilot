[build]
  ignore = "node ./scripts/netlify-ignore-build.mjs starter"
  command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/call-copilot VITE_APP_BASE_PATH=/call-copilot NITRO_PRESET=netlify pnpm --filter call-copilot build"
  publish = "apps/call-copilot/dist"
  functions = "apps/call-copilot/.netlify/functions-internal"

[build.environment]
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

  APP_BASE_PATH = "/call-copilot"
  VITE_APP_BASE_PATH = "/call-copilot"